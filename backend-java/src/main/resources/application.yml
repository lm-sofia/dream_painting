spring:
  application:
    name: backend-java
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ai_project}
    username: ${DB_USER:app_user}
    password: ${DB_PASSWORD:app_password}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  jackson:
    default-property-inclusion: non_null
    time-zone: UTC

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    # 生产环境必须通过环境变量 JWT_SECRET 覆盖（长度 >= 32 字节）
    secret: ${JWT_SECRET:dev-only-change-me-in-production-0123456789abcdef}
    expiration-ms: 86400000

ai:
  video:
    # 生成引擎：mock（默认，无 Key 跑通全链路）| seedance（火山方舟，需配 Key）
    provider: ${AI_VIDEO_PROVIDER:mock}
    seedance:
      # 密钥安全：只从环境变量注入（.env → 启动脚本），绝不写死在代码/配置里
      base-url: ${ARK_BASE_URL:https://ark.cn-beijing.volces.com/api/v3}
      api-key: ${ARK_API_KEY:}
      model: ${ARK_MODEL:doubao-seedance-1-0-pro-250528}

logging:
  level:
    com.aiproject: INFO
    org.hibernate.SQL: WARN

management:
  endpoints:
    web:
      exposure:
        # 只暴露需要的端点，避免 info/env/beans 等敏感信息外泄
        include: health,info,metrics,prometheus
  endpoint:
    health:
      # health 详情显示各组件的 UP/DOWN（db/redis），便于排查
      show-details: always
  metrics:
    tags:
      # 所有指标自动带上 application 标签，多服务混在一个 Prometheus 时靠它区分
      application: ${spring.application.name}
