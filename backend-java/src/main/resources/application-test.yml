# 测试环境配置：H2 内存库，无需真实 PostgreSQL
spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    # 关键：让 data.sql 在 Hibernate 建表之后执行（否则表不存在报错）
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
      data-locations: classpath:seed-data.sql
  data:
    redis:
      # 测试不连接真实 Redis
      host: 127.0.0.1
      port: 6399

app:
  jwt:
    secret: test-secret-key-for-unit-tests-0123456789abcdef
    expiration-ms: 86400000
