# =====================================================================
# 契约测试流水线：真实 PostgreSQL + Redis 环境下启动后端跑统一契约断言
# 注意：.NET 后端仅骨架（第 0 课），第 1-6 课业务待同步，当前契约只跑 Java 端；
#       .NET 同步完成后，把下面命令改回 `python tests/contract_test.py --all`
# =====================================================================
name: Contract Test

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Contract (Java, 44 assertions, real PG+Redis)
    runs-on: ubuntu-latest
    # 依赖服务：真实 PostgreSQL 与 Redis
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ai_project
          POSTGRES_USER: app_user
          POSTGRES_PASSWORD: app_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app_user -d ai_project"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure Maven mirror (Aliyun)
        run: |
          mkdir -p ~/.m2
          cp backend-java/docker-settings.xml ~/.m2/settings.xml

      - name: Install requests
        run: pip install requests

      # Java 默认 profile 为 ddl-auto=validate（不建表），必须先用权威 SQL 初始化
      - name: Initialize PostgreSQL (schema + seed)
        run: |
          cat database/init/01_create_schema.sql database/init/02_seed_data.sql > /tmp/init.sql
          docker run --rm -i --network host \
            -e PGPASSWORD=app_password \
            postgres:16-alpine psql -h localhost -U app_user -d ai_project < /tmp/init.sql

      - name: Start Java backend (8080, prod profile -> real PG/Redis)
        working-directory: backend-java
        run: |
          nohup mvn -B spring-boot:run > /tmp/java.log 2>&1 &

      - name: Wait for Java backend
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/v1/health || true)
            if [ "$code" = "200" ]; then echo "Java backend ready"; exit 0; fi
            sleep 5
          done
          echo "=== java.log ==="; tail -40 /tmp/java.log
          echo "Backend failed to start"; exit 1

      # .NET 同步第 1-6 课后改回：python tests/contract_test.py --all
      - name: Run contract tests (Java)
        run: python tests/contract_test.py --base-url http://localhost:8080/api/v1

      - name: Upload backend logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-logs
          path: |
            /tmp/java.log
