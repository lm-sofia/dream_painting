# =====================================================================
# 双后端契约测试流水线：真实 PostgreSQL + Redis 环境下
# 启动 Java/.NET 后端，跑统一契约断言（tests/contract_test.py --all）
# =====================================================================
name: Contract Test

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Contract (23 assertions × 2 backends)
    runs-on: ubuntu-latest
    # 依赖服务：真实 PostgreSQL 与 Redis
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ai_project
          POSTGRES_USER: app_user
          POSTGRES_PASSWORD: app_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app_user -d ai_project"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure Maven mirror (Aliyun)
        run: |
          mkdir -p ~/.m2
          cp backend-java/docker-settings.xml ~/.m2/settings.xml

      - name: Install requests
        run: pip install requests

      - name: Start Java backend (8080)
        working-directory: backend-java
        run: |
          nohup mvn -B spring-boot:run -Dspring-boot.run.arguments="--server.port=8080" > /tmp/java.log 2>&1 &

      - name: Start .NET backend (5080)
        working-directory: backend-dotnet/AiProject.Api
        run: |
          export ConnectionStrings__DefaultConnection="Host=localhost;Port=5432;Database=ai_project;Username=app_user;Password=app_password"
          export Jwt__Secret="ci-test-secret-key-0123456789abcdef0123456789abcdef"
          export ASPNETCORE_URLS="http://+:5080"
          nohup dotnet run --no-launch-profile > /tmp/dotnet.log 2>&1 &

      - name: Wait for both backends
        run: |
          for i in $(seq 1 60); do
            java_ok=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/v1/health || true)
            dotnet_ok=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5080/api/v1/health || true)
            if [ "$java_ok" = "200" ] && [ "$dotnet_ok" = "200" ]; then
              echo "Both backends ready"; exit 0
            fi
            sleep 5
          done
          echo "=== java.log ==="; tail -30 /tmp/java.log
          echo "=== dotnet.log ==="; tail -30 /tmp/dotnet.log
          echo "Backends failed to start"; exit 1

      - name: Run contract tests
        run: python tests/contract_test.py --all

      - name: Upload backend logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-logs
          path: |
            /tmp/java.log
            /tmp/dotnet.log
