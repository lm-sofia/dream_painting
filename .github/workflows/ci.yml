# =====================================================================
# CI 主流水线：单元测试 + 前端质量门禁（快速反馈）
# 触发：push / PR 到 master
# =====================================================================
name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------- Java 后端：编译 + 单测/集成测试 ----------
  backend-java:
    name: backend-java (Spring Boot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Configure Maven mirror (Aliyun)
        run: |
          mkdir -p ~/.m2
          cp backend-java/docker-settings.xml ~/.m2/settings.xml

      - name: Run tests
        run: mvn -B test
        working-directory: backend-java

  # ---------- .NET 后端：编译 + 测试 ----------
  backend-dotnet:
    name: backend-dotnet (ASP.NET Core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
          cache: true
          cache-dependency-path: backend-dotnet/AiProject.Api.Tests/packages.lock.json

      - name: Run tests
        run: dotnet test --nologo
        working-directory: backend-dotnet/AiProject.Api.Tests

  # ---------- 前端：ESLint + Prettier + 类型检查 + 构建 ----------
  frontend:
    name: frontend (React)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: ESLint
        run: npm run lint
        working-directory: frontend

      - name: Prettier check
        run: npm run format:check
        working-directory: frontend

      - name: Type check & Build
        run: npm run build
        working-directory: frontend
