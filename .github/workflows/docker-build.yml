# =====================================================================
# Docker 镜像发布流水线：main 分支构建并推送 GHCR
# 触发：push main 或 tag v*（tag 推送 latest + 版本标签）
# 使用：GitHub Container Registry，无需额外凭据（GITHUB_TOKEN 自动注入）
# =====================================================================
name: Docker Build & Publish

on:
  push:
    branches: [master, main]
    tags: ["v*"]

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  build:
    name: Build & push images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service: [frontend, backend-java, backend-dotnet]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          SERVICE="${{ matrix.service }}"
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/$SERVICE"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          TAGS="${IMAGE}:latest"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAGS="${TAGS},${IMAGE}:${{ github.ref_name }}"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
